<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Optimizer</title>

```
<link rel="stylesheet" href="style.css">

<!-- Art Deco Font -->
<link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
```

</head>

<body>

```
<div class="container">

    <h1>📅 Schedule Optimizer</h1>

    <p>
        Create a healthy and productive schedule while protecting
        your sleep and break times.
    </p>

    <label>Sleep Time</label>
    <input type="time" id="sleepTime">

    <label>Wake Up Time</label>
    <input type="time" id="wakeTime">

    <label>Daily Tasks (one per line)</label>
    <textarea
        id="tasks"
        rows="5"
        placeholder="Gym
```

DSA Practice
Project Work"></textarea>

```
    <label>Duration of Tasks (minutes, one per line)</label>
    <textarea
        id="durations"
        rows="5"
        placeholder="60
```

120
180"></textarea>

```
    <label>Priority of Tasks (1 = Highest, 5 = Lowest)</label>
    <textarea
        id="priorities"
        rows="5"
        placeholder="1
```

2
3"></textarea>

```
    <label>Special Events (one per line)</label>
    <textarea
        id="events"
        rows="4"
        placeholder="College
```

Doctor Appointment"></textarea>

```
    <label>Event Start Times (one per line)</label>
    <textarea
        id="eventStarts"
        rows="4"
        placeholder="09:00
```

18:00"></textarea>

```
    <label>Event End Times (one per line)</label>
    <textarea
        id="eventEnds"
        rows="4"
        placeholder="16:00
```

19:00"></textarea>

```
    <button onclick="generateSchedule()">
        Generate Schedule
    </button>

    <div id="output">

        <h2>Your Schedule</h2>

        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Event</th>
                </tr>
            </thead>

            <tbody id="scheduleTable">
            </tbody>

        </table>

    </div>

</div>

<script src="script.js"></script>
```

</body>

</html>
